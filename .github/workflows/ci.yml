# Checks every push and pull request. The README and CONTRIBUTING promise contributors that
# their PR is type-checked and built on both platforms — this is that promise.
#
# `pull_request` (not pull_request_target) on purpose: fork PRs run WITHOUT access to any
# secret, so a malicious PR cannot exfiltrate the signing key. Nothing here needs secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck & build (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify public repository boundary
        run: node scripts/check-public-scope.mjs
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      # Cheap, and it is the check that was missing: a Dependabot bump of
      # @tauri-apps/api passed CI and only broke at release time, on all three platforms.
      - run: node scripts/check-tauri-versions.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      # Behavioural check, not a type check. The live-dictation audio pump broke in a way
      # tsc and the bundler both accepted happily — an async promise reset from inside its
      # own body — and it shipped. Compilation was never the gate that was missing.
      - run: node scripts/test-live-session.mjs

  rust:
    name: Check Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      # The frontend must exist before Rust checks: tauri.conf.json points at dist/.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: cargo check --manifest-path src-tauri/Cargo.toml

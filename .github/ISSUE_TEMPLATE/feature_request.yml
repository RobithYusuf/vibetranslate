name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution — it often leads somewhere better.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations: { required: true }

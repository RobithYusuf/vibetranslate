[package]
name = "vibetranslate"
version = "1.0.37"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-clipboard-manager = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-store = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-autostart = "2.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
enigo = "0.2"
once_cell = "1.19"
tauri-plugin-http = "2.5.9"
sherpa-onnx = "1.13.4"
# Integrity check for downloaded speech models (see stt.rs ModelFile::sha256).
sha2 = "0.10"
base64 = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2.7"
# Global mouse-button hook (CGEventTap). All already in the tree via cocoa 0.26, so
# pinning to the same minor adds no extra crate version.
core-graphics = "0.25"
core-foundation = "0.10"
core-foundation-sys = "0.8"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
